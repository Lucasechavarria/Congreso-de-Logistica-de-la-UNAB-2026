<!DOCTYPE html>
<html>
<head>
    <style>
        .email-container {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }
        .header {
            background-color: #000000;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 30px;
            line-height: 1.6;
            color: #333333;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666666;
            border-top: 1px solid #eeeeee;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <img src="cid:logo_congreso" alt="Logo Congreso" style="max-height: 80px;">
        </div>
        <div class="content">
            {{ body|safe }}
        </div>
        <div class="footer">
            <p><strong>Congreso de Logística y Transporte UNaB 2026</strong></p>
            <p>Campus UNAB, Blas Parera 132, Burzaco, Buenos Aires</p>
            <p>© 2026 Universidad Nacional Guillermo Brown</p>
        </div>
    </div>
</body>
</html>
