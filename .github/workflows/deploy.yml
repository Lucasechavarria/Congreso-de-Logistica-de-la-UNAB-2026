name: Deploy to UNAB Server (Hybrid)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend & Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm run build:client

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            dist/spa/
            backend/
            package.json
            pnpm-lock.yaml

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Emergency Disk Cleanup
        run: |
          echo "Iniciando limpieza de emergencia para liberar espacio..."
          # 1. Limpiar logs de sistema de más de 1 día
          sudo journalctl --vacuum-time=1d || true
          # 2. Limpiar caché de paquetes de Linux
          sudo apt-get clean || true
          # 3. Borrar archivos temporales del sistema
          sudo rm -rf /tmp/* || true
          # 4. Limpiar caché de pip y archivos __pycache__ huérfanos
          find /var/www/congreso/ -name "__pycache__" -type d -exec rm -rf {} + || true
          # 5. Si Docker está instalado, limpiar imágenes/contenedores colgados
          if command -v docker &> /dev/null; then
            docker system prune -f || true
          fi
          echo "Limpieza completada. Espacio disponible actual:"
          df -h /

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Prepare Directories
        run: |
          # 1. Asegurar directorios base
          mkdir -p /var/www/congreso/client/dist
          mkdir -p /var/www/congreso/backend/static
          
          # 2. Reclamar propiedad de las carpetas antes de cualquier operación de escritura/borrado
          # Esto es CRÍTICO para que rsync y rm funcionen sin Permission Denied
          sudo chown -R $(whoami):$(whoami) /var/www/congreso/

      - name: Deploy Frontend
        run: |
          rm -rf /var/www/congreso/client/dist/*
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Clean Python Cache
        run: |
          # Eliminar archivos .pyc compilados para ahorrar espacio antes de sincronizar
          find backend/ -type d -name "__pycache__" -exec rm -rf {} + || true
          find backend/ -name "*.pyc" -delete || true

      - name: Sync Backend
        run: |
          # Usamos --no-perms --no-owner --no-group para evitar errores de rsync al intentar
          # establecer dueños que no corresponden al usuario del runner.
          # Excluimos archivos temporales y sockets para evitar fallos de unlink.
          rsync -av --delete \
            --no-perms --no-owner --no-group \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='env' \
            --exclude='static' \
            --exclude='media' \
            --exclude='private_media' \
            --exclude='*.sock' \
            --exclude='*.ctl' \
            --exclude='__pycache__/' \
            backend/ /var/www/congreso/backend/

      - name: Ensure Python Environment (venv)
        run: |

          # Asegurar venv existe y está limpio para evitar errores 203/EXEC
          echo "Saneando entorno virtual en /venv/..."
          python3 -m venv /var/www/congreso/backend/venv

      - name: Install Python Dependencies
        run: |
          # Usar 'python -m pip' es más robusto ante rutas movidas
          /var/www/congreso/backend/venv/bin/python -m pip install --upgrade pip
          /var/www/congreso/backend/venv/bin/python -m pip install -r /var/www/congreso/backend/requirements.txt

      - name: Run Database Migrations
        run: |
          /var/www/congreso/backend/venv/bin/python /var/www/congreso/backend/manage.py migrate --noinput

      - name: Validate Python Syntax (Pre-restart)
        run: |
          # Verificar errores de sintaxis antes de reiniciar para evitar downtime
          /var/www/congreso/backend/venv/bin/python -m compileall -q /var/www/congreso/backend/
          # Asegurar permisos de ejecución para scripts de mantenimiento
          chmod +x /var/www/congreso/backend/scripts/*.sh || true

      - name: Restart Services
        run: |
          # 1. Matar procesos huérfanos y limpiar sockets para evitar 502 Bad Gateway
          echo "Saneando procesos de Gunicorn antiguos..."
          sudo pkill -9 gunicorn || true
          sudo rm -f /var/www/congreso/backend/congreso.sock || true
          
          # 2. Reinicio forzado para asegurar que se cargue el nuevo código
          sudo systemctl restart congreso
          sudo systemctl restart nginx
          
          # 3. Asegurar permisos del socket para Nginx (www-data)
          # Esperar un segundo a que Gunicorn cree el socket
          sleep 2
          sudo chown :www-data /var/www/congreso/backend/congreso.sock || true
          sudo chmod 660 /var/www/congreso/backend/congreso.sock || true
          
          echo "Verificando estado de servicios..."
          sudo systemctl status congreso --no-pager
          echo "Deploy complete. Memory freed and services restarted."

      - name: Health Check (Verify Site is UP)
        run: |
          # Esperar unos segundos a que Gunicorn levante el socket
          sleep 5
          # Verificar si el sitio responde (Ignorar SSL y seguir redirecciones)
          # Buscamos un código 200 o 302
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" -L -k https://www.congresologistica.unab.edu.ar/ || echo "000")
          echo "Status Code: $STATUS_CODE"
          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "302" ]]; then
            echo "::error::El sitio no está respondiendo correctamente (Status: $STATUS_CODE)"
            exit 1
          fi

      - name: Update Diagnostic File
        run: |
          # 1. Asegurar permisos antes de escribir el archivo final
          sudo chown $(whoami):$(whoami) /var/www/congreso/backend/static/diag.txt || true
          
          # 2. Generar reporte (se añade || true al grep para evitar fallos si no hay procesos listados)
          {
            echo "=== Post-deploy Diagnostic ==="
            echo "Time: $(date)"
            echo "Revision: ${{ github.sha }}"
            echo "Status: SUCCESS"
            echo "Health: OK"
            echo "Gunicorn processes:"
            ps aux | grep gunicorn | grep -v grep || echo "No active gunicorn processes found in ps (expected if using socket service)."
          } > /var/www/congreso/backend/static/diag.txt
          
          # 3. Restaurar permisos para que Nginx pueda servirlo
          sudo chmod 644 /var/www/congreso/backend/static/diag.txt

# v12 - Optimized deploy: single venv, cache cleanup, strict sudo reload.