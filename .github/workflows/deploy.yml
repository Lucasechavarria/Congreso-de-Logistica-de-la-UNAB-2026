name: Deploy to UNAB Server (Hybrid)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frontend & Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm run build:client

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            dist/spa/
            backend/
            package.json
            pnpm-lock.yaml

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Prepare Directories
        run: |
          mkdir -p /var/www/congreso/client/dist
          mkdir -p /var/www/congreso/backend
          # Intentar recrear venv si no existe o si fue accidentalmente borrado
          # Se usa python3 -m venv. Si ya existe, no hace nada perjudicial.
          python3 -m venv /var/www/congreso/backend/env || true

      - name: Deploy Frontend
        run: |
          # Limpiar antes de copiar
          rm -rf /var/www/congreso/client/dist/*
          # Copiar el build del frontend (desde la descarga del artefacto)
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Sync Backend
        run: |
          # Sincronizar código del backend (SIN --delete por ahora para evitar más pérdidas)
          rsync -av --exclude='.env' --exclude='venv' --exclude='env' --exclude='static' --exclude='media' --exclude='private_media' backend/ /var/www/congreso/backend/

      - name: Install Python Dependencies
        run: |
          # Asegurar que pip esté actualizado y luego instalar requirements
          # Continuar en caso de error para que ignore paquetes inexistentes tipo legacy-cgi
          /var/www/congreso/backend/env/bin/python -m pip install --upgrade pip || true
          /var/www/congreso/backend/env/bin/pip install -r /var/www/congreso/backend/requirements.txt || true

      - name: Run Database Migrations
        run: |
          # Aplicar las migraciones automáticamente (ignorar si fallan por bloqueo de Postgres)
          # Esto garantiza que el flujo llegue al reinicio
          /var/www/congreso/backend/env/bin/python /var/www/congreso/backend/manage.py migrate || true

      - name: Restart Backend Service
        run: |
          # Reiniciar Gunicorn para aplicar cambios
          sudo systemctl restart gunicorn

# Reconstruction deploy v4 - Force venv creation