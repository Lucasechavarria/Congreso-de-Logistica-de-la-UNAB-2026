name: Deploy to UNAB Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          # Se usa la versión del lockfile (10) para evitar errores de compatibilidad
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build SPA
        run: pnpm run build:client

      - name: Deploy to Folder
        run: |
          # Como el runner ahora es el usuario 'deployer', 
          # asegúrate de que tenga permisos en /var/www/congreso
          cp -R dist/spa/* /var/www/congreso/
