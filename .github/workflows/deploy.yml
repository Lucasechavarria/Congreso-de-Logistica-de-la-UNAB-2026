name: Deploy to UNAB Server (Hybrid)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frontend & Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm run build:client

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            dist/spa/
            backend/
            package.json
            pnpm-lock.yaml

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Prepare Directories
        run: |
          mkdir -p /var/www/congreso/client/dist
          mkdir -p /var/www/congreso/backend/static

      - name: Deploy Frontend
        run: |
          rm -rf /var/www/congreso/client/dist/*
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Sync Backend to BOTH venvs
        run: |
          # Sincronizar código a la carpeta principal del backend
          rsync -av --delete \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='env' \
            --exclude='static' \
            --exclude='media' \
            --exclude='private_media' \
            backend/ /var/www/congreso/backend/

      - name: Install Python Dependencies in VENV (used by root/gunicorn)
        run: |
          # IMPORTANT: La instancia activa de gunicorn usa /venv/ no /env/
          # Actualizamos las dependencias en ese entorno virtual
          /var/www/congreso/backend/venv/bin/python -m pip install --upgrade pip || true
          /var/www/congreso/backend/venv/bin/pip install -r /var/www/congreso/backend/requirements.txt || true

      - name: Install Python Dependencies in ENV (fallback)
        run: |
          /var/www/congreso/backend/env/bin/python -m pip install --upgrade pip || true
          /var/www/congreso/backend/env/bin/pip install -r /var/www/congreso/backend/requirements.txt || true

      - name: Run Database Migrations (via VENV)
        run: |
          /var/www/congreso/backend/venv/bin/python /var/www/congreso/backend/manage.py migrate --noinput || true

      - name: Reload Gunicorn via HUP signal
        run: |
          # Enviamos HUP al proceso master de gunicorn (PID de root) para recargar el codigo
          # HUP no mata el servicio, solo recarga los workers con el nuevo codigo
          GUNICORN_PID=$(pgrep -u root -f "gunicorn.*core.wsgi" | head -1)
          if [ -n "$GUNICORN_PID" ]; then
            echo "Sending HUP to Gunicorn master PID: $GUNICORN_PID"
            kill -HUP $GUNICORN_PID && echo "HUP signal sent successfully!"
          else
            echo "No root gunicorn process found, trying www-data..."
            GUNICORN_PID2=$(pgrep -u www-data -f "gunicorn.*core.wsgi" | head -1)
            if [ -n "$GUNICORN_PID2" ]; then
              kill -HUP $GUNICORN_PID2 && echo "HUP sent to www-data gunicorn PID: $GUNICORN_PID2"
            else
              echo "WARNING: No gunicorn process found to reload."
            fi
          fi

      - name: Update Diagnostic File
        run: |
          {
            echo "=== Post-deploy Diagnostic ==="
            echo "Time: $(date)"
            echo "User: $(whoami)"
            echo "Gunicorn processes:"
            ps aux | grep gunicorn | grep -v grep
          } > /var/www/congreso/backend/static/diag.txt

# v10 - Dual-venv fix: Targets the active venv AND sends HUP reload signal to gunicorn master