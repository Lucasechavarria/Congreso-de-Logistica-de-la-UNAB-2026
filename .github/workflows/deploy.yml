name: Deploy Frontend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }} # Asegúrate de que este Secret tenga la IP correcta
          username: root
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: /var/www/congreso/frontend/deploy.sh
