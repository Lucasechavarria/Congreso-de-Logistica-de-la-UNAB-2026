name: Deploy to UNAB Server (Hybrid)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frontend & Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm run build:client

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            dist/spa/
            backend/
            package.json
            pnpm-lock.yaml

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Zero-SSH Diagnostic
        run: |
          mkdir -p /var/www/congreso/backend/static
          {
            echo "=== Deployment Diagnostic ==="
            echo "Time: $(date)"
            echo "User: $(whoami)"
            echo "Groups: $(groups)"
            echo "Processes:"
            ps aux | grep gunicorn | grep -v grep
            echo "Permissions on socket/bin if possible:"
            ls -l /var/www/congreso/backend/env/bin/python || echo "env bin not found"
          } > /var/www/congreso/backend/static/diag.txt

      - name: Prepare Directories
        run: |
          mkdir -p /var/www/congreso/client/dist
          mkdir -p /var/www/congreso/backend/static
          python3 -m venv /var/www/congreso/backend/env || true

      - name: Deploy Frontend
        run: |
          rm -rf /var/www/congreso/client/dist/*
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Sync Backend
        run: |
          rsync -av --delete --exclude='.env' --exclude='venv' --exclude='env' --exclude='static' --exclude='media' --exclude='private_media' backend/ /var/www/congreso/backend/

      - name: Install Python Dependencies
        run: |
          /var/www/congreso/backend/env/bin/python -m pip install --upgrade pip || true
          /var/www/congreso/backend/env/bin/pip install -r /var/www/congreso/backend/requirements.txt || true

      - name: Run Database Migrations
        run: |
          /var/www/congreso/backend/env/bin/python /var/www/congreso/backend/manage.py migrate --noinput || true

      - name: Restart Services (Zero-SSH Protocol)
        run: |
          # Intentamos recarga suave mediante señal HUP si el usuario es dueño
          pkill -HUP -u $(whoami) gunicorn || echo "pkill HUP failed or no processes owned by $(whoami)"
          
          # Intentamos reinicio tradicional (solo si hay permisos)
          systemctl restart gunicorn || echo "systemctl restart failed - lack of permissions"
          
          # Verificación final de procesos para diag.txt
          echo "Process status after restart attempts:" >> /var/www/congreso/backend/static/diag.txt
          ps aux | grep gunicorn | grep -v grep >> /var/www/congreso/backend/static/diag.txt
          echo "Services deployment completed."

# Zero-SSH Recovery Protocol v9 - Diagnostic + HUP Signal