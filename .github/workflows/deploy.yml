name: Deploy to UNAB Server (Hybrid)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frontend & Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm run build:client

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            dist/spa/
            backend/
            package.json
            pnpm-lock.yaml

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Prepare Directories
        run: |
          mkdir -p /var/www/congreso/client/dist
          mkdir -p /var/www/congreso/backend

      - name: Deploy Frontend
        run: |
          # Limpiar antes de copiar
          rm -rf /var/www/congreso/client/dist/*
          # Copiar el build del frontend (desde la descarga del artefacto)
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Sync Backend
        run: |
          # Sincronizar código del backend (excluyendo lo local del server)
          rsync -av --exclude='.env' --exclude='venv' --exclude='env' --exclude='static' --exclude='media' --exclude='private_media' backend/ /var/www/congreso/backend/

      - name: Install Python Dependencies
        run: |
          # Instalar/actualizar dependencias en el entorno virtual del servidor
          /var/www/congreso/backend/env/bin/pip install -r /var/www/congreso/backend/requirements.txt

      - name: Restart Backend Service
        run: |
          # Reiniciar Gunicorn para aplicar cambios
          sudo systemctl restart gunicorn

# Triggering fresh hybrid deploy