name: Deploy to UNAB Server (Hybrid)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frontend & Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm run build:client

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            dist/spa/
            backend/
            package.json
            pnpm-lock.yaml

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Prepare Directories
        run: |
          # 1. Asegurar directorios base
          mkdir -p /var/www/congreso/client/dist
          mkdir -p /var/www/congreso/backend/static
          
          # 2. Reclamar propiedad de las carpetas antes de cualquier operación de escritura/borrado
          # Esto es CRÍTICO para que rsync y rm funcionen sin Permission Denied
          sudo chown -R $(whoami):$(whoami) /var/www/congreso/

      - name: Deploy Frontend
        run: |
          rm -rf /var/www/congreso/client/dist/*
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Clean Python Cache
        run: |
          # Eliminar archivos .pyc compilados para ahorrar espacio antes de sincronizar
          find backend/ -type d -name "__pycache__" -exec rm -rf {} + || true
          find backend/ -name "*.pyc" -delete || true

      - name: Sync Backend
        run: |
          # Usamos --no-perms --no-owner --no-group para evitar errores de rsync al intentar
          # establecer dueños que no corresponden al usuario del runner.
          # Excluimos archivos temporales y sockets para evitar fallos de unlink.
          rsync -av --delete \
            --no-perms --no-owner --no-group \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='env' \
            --exclude='static' \
            --exclude='media' \
            --exclude='private_media' \
            --exclude='*.sock' \
            --exclude='*.ctl' \
            --exclude='__pycache__/' \
            backend/ /var/www/congreso/backend/

      - name: Ensure Python Environment (env)
        run: |

          # 2. Eliminar rastro de venv (carpeta obsoleta que causa conflictos de ruta)
          if [ -d "/var/www/congreso/backend/venv" ]; then
            echo "Eliminando carpeta venv obsoleta..."
            sudo rm -rf /var/www/congreso/backend/venv
          fi
          
          # 3. Asegurar que env existe y está limpio para evitar errores 203/EXEC
          echo "Saneando entorno virtual en /env/..."
          python3 -m venv /var/www/congreso/backend/env

      - name: Install Python Dependencies
        run: |
          # Usar 'python -m pip' es más robusto ante rutas movidas
          /var/www/congreso/backend/env/bin/python -m pip install --upgrade pip
          /var/www/congreso/backend/env/bin/python -m pip install -r /var/www/congreso/backend/requirements.txt

      - name: Run Database Migrations
        run: |
          /var/www/congreso/backend/env/bin/python /var/www/congreso/backend/manage.py migrate --noinput

      - name: Validate Python Syntax (Pre-restart)
        run: |
          # Verificar errores de sintaxis antes de reiniciar para evitar downtime
          /var/www/congreso/backend/env/bin/python -m compileall -q /var/www/congreso/backend/
          # Asegurar permisos de ejecución para scripts de mantenimiento
          chmod +x /var/www/congreso/backend/scripts/*.sh || true

      - name: Restart Services
        run: |
          # 1. Matar procesos huérfanos y limpiar sockets para evitar 502 Bad Gateway
          echo "Saneando procesos de Gunicorn antiguos..."
          sudo pkill -9 gunicorn || true
          sudo rm -f /var/www/congreso/backend/congreso.sock || true
          
          # 2. Reinicio forzado para asegurar que se cargue el nuevo código
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
          
          # 3. Asegurar permisos del socket para Nginx
          sudo chown www-data:www-data /var/www/congreso/backend/congreso.sock || true
          sudo chmod 666 /var/www/congreso/backend/congreso.sock || true
          
          echo "Verificando estado de servicios..."
          sudo systemctl status gunicorn --no-pager
          echo "Deploy complete. Memory freed and services restarted."

      - name: Health Check (Verify Site is UP)
        run: |
          # Esperar unos segundos a que Gunicorn levante el socket
          sleep 5
          # Verificar si el sitio responde (Ignorar SSL y seguir redirecciones)
          # Buscamos un código 200 o 302
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" -L -k https://www.congresologistica.unab.edu.ar/ || echo "000")
          echo "Status Code: $STATUS_CODE"
          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "302" ]]; then
            echo "::error::El sitio no está respondiendo correctamente (Status: $STATUS_CODE)"
            exit 1
          fi

      - name: Update Diagnostic File
        run: |
          {
            echo "=== Post-deploy Diagnostic ==="
            echo "Time: $(date)"
            echo "Revision: ${{ github.sha }}"
            echo "Status: SUCCESS"
            echo "Health: OK"
            echo "Gunicorn processes:"
            ps aux | grep gunicorn | grep -v grep
          } > /var/www/congreso/backend/static/diag.txt

# v12 - Optimized deploy: single venv, cache cleanup, strict sudo reload.