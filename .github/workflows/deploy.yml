name: Deploy to UNAB Server (Hybrid)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frontend & Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm run build:client

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            dist/spa/
            backend/
            package.json
            pnpm-lock.yaml

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Prepare Directories
        run: |
          mkdir -p /var/www/congreso/client/dist
          mkdir -p /var/www/congreso/backend/static

      - name: Deploy Frontend
        run: |
          rm -rf /var/www/congreso/client/dist/*
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Clean Python Cache
        run: |
          # Eliminar archivos .pyc compilados para ahorrar espacio antes de sincronizar
          find backend/ -type d -name "__pycache__" -exec rm -rf {} + || true
          find backend/ -name "*.pyc" -delete || true

      - name: Sync Backend
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='env' \
            --exclude='static' \
            --exclude='media' \
            --exclude='private_media' \
            backend/ /var/www/congreso/backend/

      - name: Install Python Dependencies (env)
        run: |
          # Usar exclusivamente /env/ (entorno real de gunicorn) para ahorrar espacio
          /var/www/congreso/backend/env/bin/python -m pip install --upgrade pip || true
          /var/www/congreso/backend/env/bin/pip install -r /var/www/congreso/backend/requirements.txt || true

      - name: Run Database Migrations
        run: |
          /var/www/congreso/backend/env/bin/python /var/www/congreso/backend/manage.py migrate --noinput

      - name: Restart Services
        run: |
          # Reinicio forzado para asegurar que se cargue el nuevo código
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
          echo "Verificando estado de servicios..."
          sudo systemctl status gunicorn --no-pager
          echo "Deploy complete. Memory freed and services restarted."

      - name: Update Diagnostic File
        run: |
          {
            echo "=== Post-deploy Diagnostic ==="
            echo "Time: $(date)"
            echo "User: $(whoami)"
            echo "Gunicorn processes:"
            ps aux | grep gunicorn | grep -v grep
          } > /var/www/congreso/backend/static/diag.txt

# v12 - Optimized deploy: single venv, cache cleanup, strict sudo reload.