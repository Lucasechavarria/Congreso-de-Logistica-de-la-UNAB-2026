name: Deploy to UNAB Server (Hybrid)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frontend & Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm run build:client

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            dist/spa/
            backend/
            package.json
            pnpm-lock.yaml

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Prepare Directories
        run: |
          mkdir -p /var/www/congreso/client/dist
          mkdir -p /var/www/congreso/backend/static

      - name: Deploy Frontend
        run: |
          rm -rf /var/www/congreso/client/dist/*
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Sync Backend
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='env' \
            --exclude='static' \
            --exclude='media' \
            --exclude='private_media' \
            backend/ /var/www/congreso/backend/

      - name: Install Python Dependencies (venv - active gunicorn env)
        run: |
          /var/www/congreso/backend/venv/bin/python -m pip install --upgrade pip || true
          /var/www/congreso/backend/venv/bin/pip install -r /var/www/congreso/backend/requirements.txt || true

      - name: Install Python Dependencies (env - fallback)
        run: |
          /var/www/congreso/backend/env/bin/python -m pip install --upgrade pip || true
          /var/www/congreso/backend/env/bin/pip install -r /var/www/congreso/backend/requirements.txt || true

      - name: Run Database Migrations
        run: |
          /var/www/congreso/backend/venv/bin/python /var/www/congreso/backend/manage.py migrate --noinput || true

      - name: Reload Gunicorn (if sudoers configured)
        run: |
          # Este paso requiere que 'deployer' tenga NOPASSWD en sudoers.
          # Ejecutar en el servidor una vez como root para habilitarlo:
          # echo "deployer ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart gunicorn, /usr/bin/systemctl restart nginx" | sudo tee /etc/sudoers.d/deployer-restart
          sudo systemctl restart gunicorn || echo "WARNING: Could not restart gunicorn. Configure sudoers NOPASSWD for deployer."
          sudo systemctl restart nginx || echo "WARNING: Could not restart nginx."
          echo "Deploy complete. Code updated in /venv/ and /env/."

      - name: Update Diagnostic File
        run: |
          {
            echo "=== Post-deploy Diagnostic ==="
            echo "Time: $(date)"
            echo "User: $(whoami)"
            echo "Gunicorn processes:"
            ps aux | grep gunicorn | grep -v grep
          } > /var/www/congreso/backend/static/diag.txt

# v11 - Stable deploy: updates both envs, graceful restart attempt with sudoers note