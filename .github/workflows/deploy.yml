name: Deploy to UNAB Server (Hybrid)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frontend & Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm run build:client

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            dist/spa/
            backend/
            package.json
            pnpm-lock.yaml

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Prepare Directories
        run: |
          mkdir -p /var/www/congreso/client/dist
          mkdir -p /var/www/congreso/backend
          # Recreación forzada del entorno virtual para asegurar limpieza
          python3 -m venv /var/www/congreso/backend/env || true

      - name: Deploy Frontend
        run: |
          # Limpiar antes de copiar
          rm -rf /var/www/congreso/client/dist/*
          # Copiar el build del frontend (desde la descarga del artefacto)
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Sync Backend
        run: |
          # Sincronizar código del backend (excluyendo lo local del server) e incluir --delete
          rsync -av --delete --exclude='.env' --exclude='venv' --exclude='env' --exclude='static' --exclude='media' --exclude='private_media' backend/ /var/www/congreso/backend/

      - name: Install Python Dependencies
        run: |
          # Actualizar pip e instalar dependencias.
          /var/www/congreso/backend/env/bin/python -m pip install --upgrade pip || true
          /var/www/congreso/backend/env/bin/pip install -r /var/www/congreso/backend/requirements.txt || true

      - name: Run Database Migrations
        run: |
          # Intentar migraciones bin/python
          /var/www/congreso/backend/env/bin/python /var/www/congreso/backend/manage.py migrate --noinput || true

      - name: Restart Services
        run: |
          # Reiniciar servicios básicos (estos suelen tener permisos NOPASSWD)
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
          echo "Services restarted."

