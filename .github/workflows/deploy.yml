name: Deploy to UNAB Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build SPA
        run: pnpm run build:client

      - name: Deploy Frontend
        run: |
          # Asegurar que la ruta destino de Nginx exista
          mkdir -p /var/www/congreso/client/dist
          # Limpiar antes de copiar
          rm -rf /var/www/congreso/client/dist/*
          # Copiar el build del frontend
          cp -R dist/spa/* /var/www/congreso/client/dist/

      - name: Sync Backend
        run: |
          # Sincronizar código del backend (excluyendo lo local del server)
          # El usuario deployer ya debe tener permisos en /var/www/congreso
          rsync -av --exclude='.env' --exclude='venv' --exclude='static' --exclude='media' --exclude='private_media' backend/ /var/www/congreso/backend/
          
      - name: Restart Backend Service
        run: |
          # Reiniciar Gunicorn para aplicar posibles cambios en settings.py o views
          # (Requiere permiso sudo NOPASSWD para el comando systemctl restart congreso)
          sudo systemctl restart congreso
